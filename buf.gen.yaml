version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Soo-de/suiro/internal/gen
plugins:
  - local: ["go", "tool", "-modfile=tools/go.mod", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools/go.mod", "protoc-gen-go-grpc"]
    out: internal/gen
    opt: paths=source_relative
