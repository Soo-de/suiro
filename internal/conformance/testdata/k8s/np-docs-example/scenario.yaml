name: np-docs-example
oracle: "Kubernetes, Network Policies, The NetworkPolicy resource: test-network-policy"
sources:
- id: shop/app
  kind: git
  namespace: default
  manifests: |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: test-network-policy
      namespace: default
    spec:
      podSelector:
        matchLabels:
          role: db
      policyTypes:
      - Ingress
      - Egress
      ingress:
      - from:
        - ipBlock:
            cidr: 172.17.0.0/16
            except:
            - 172.17.1.0/24
        - namespaceSelector:
            matchLabels:
              project: myproject
        - podSelector:
            matchLabels:
              role: frontend
        ports:
        - protocol: TCP
          port: 6379
      egress:
      - to:
        - ipBlock:
            cidr: 10.0.0.0/24
        ports:
        - protocol: TCP
          port: 5978
    ---
    apiVersion: v1
    kind: Namespace
    metadata: {name: default}
    ---
    apiVersion: v1
    kind: Namespace
    metadata: {name: myproject, labels: {project: myproject}}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: db, namespace: default}
    spec: {template: {metadata: {labels: {role: db}}, spec: {containers: [{name: app}]}}}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: frontend, namespace: default}
    spec: {template: {metadata: {labels: {role: frontend}}, spec: {containers: [{name: app}]}}}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: other, namespace: default}
    spec: {template: {metadata: {labels: {role: other}}, spec: {containers: [{name: app}]}}}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: client, namespace: myproject}
    spec: {template: {metadata: {labels: {role: client}}, spec: {containers: [{name: app}]}}}
  want:
    namespaces:
    - {name: default, labels: {kubernetes.io/metadata.name: default}}
    - {name: myproject, labels: {project: myproject, kubernetes.io/metadata.name: myproject}}
    workloads:
    - {key: k8s:apps/Deployment/default/db, kind: k8s:apps/Deployment, namespace: default, name: db, podLabels: {role: db}}
    - {key: k8s:apps/Deployment/default/frontend, kind: k8s:apps/Deployment, namespace: default, name: frontend, podLabels: {role: frontend}}
    - {key: k8s:apps/Deployment/default/other, kind: k8s:apps/Deployment, namespace: default, name: other, podLabels: {role: other}}
    - {key: k8s:apps/Deployment/myproject/client, kind: k8s:apps/Deployment, namespace: myproject, name: client, podLabels: {role: client}}
    gates:
    - id: k8s:networking.k8s.io/NetworkPolicy/default/test-network-policy#egress
      layer: kubernetes
      type: filter
      direction: egress
      semantics: {stateful: true, isolating: true}
      target: {pods: {namespace: default, selector: {matchLabels: {role: db}}}}
      rules:
      - action: allow
        peers: [{prefix: 10.0.0.0/24}]
        ports: [{protocol: tcp, from: 5978, to: 5978}]
        origin: {locator: "spec.egress[0]"}
      object: k8s:networking.k8s.io/NetworkPolicy/default/test-network-policy
    - id: k8s:networking.k8s.io/NetworkPolicy/default/test-network-policy#ingress
      layer: kubernetes
      type: filter
      direction: ingress
      semantics: {stateful: true, isolating: true}
      target: {pods: {namespace: default, selector: {matchLabels: {role: db}}}}
      rules:
      - action: allow
        peers:
        - {prefix: 172.17.0.0/16, except: [172.17.1.0/24]}
        - {pods: {namespace: default, namespaceSelector: {matchLabels: {project: myproject}}}}
        - {pods: {namespace: default, podSelector: {matchLabels: {role: frontend}}}}
        ports: [{protocol: tcp, from: 6379, to: 6379}]
        origin: {locator: "spec.ingress[0]"}
      object: k8s:networking.k8s.io/NetworkPolicy/default/test-network-policy
paths:
- {key: "k8s:apps/Deployment/default/frontend → k8s:apps/Deployment/default/db : tcp/6379", verdict: allow}
- {key: "k8s:apps/Deployment/myproject/client → k8s:apps/Deployment/default/db : tcp/6379", verdict: allow}
- {key: "k8s:apps/Deployment/default/other → k8s:apps/Deployment/default/db : tcp/0-65535", verdict: deny}
- {key: "k8s:apps/Deployment/default/frontend → k8s:apps/Deployment/default/db : tcp/0-6378", verdict: deny}
- {key: "k8s:apps/Deployment/default/frontend → k8s:apps/Deployment/default/db : tcp/6380-65535", verdict: deny}
- {key: "k8s:apps/Deployment/default/frontend → k8s:apps/Deployment/default/db : udp/6379", verdict: deny}
- {key: "external-private → k8s:apps/Deployment/default/db : tcp/6379", verdict: placement}
- {key: "external-private → k8s:apps/Deployment/default/db : tcp/80", verdict: deny}
- {key: "internet → k8s:apps/Deployment/default/db : tcp/6379", verdict: deny}
- {key: "k8s:apps/Deployment/default/db → external-private : tcp/5978", verdict: placement}
- {key: "k8s:apps/Deployment/default/db → external-private : tcp/80", verdict: deny}
- {key: "k8s:apps/Deployment/default/db → internet : tcp/5978", verdict: deny}
- {key: "k8s:apps/Deployment/default/db → k8s:apps/Deployment/default/frontend : tcp/0-65535", verdict: deny}
- {key: "k8s:apps/Deployment/default/frontend → k8s:apps/Deployment/default/other : tcp/0-65535", verdict: allow}
